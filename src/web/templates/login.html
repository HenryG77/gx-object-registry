<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GeneXus Object Registry</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .logo {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #6b7280;
            margin: 0;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #d1d5db;
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 10px;
            border: none;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 0.9rem;
        }

        .input-group-text {
            border-radius: 10px 0 0 10px;
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0;
        }

        .password-toggle {
            cursor: pointer;
            padding: 12px 16px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-left: none;
            border-radius: 0 10px 10px 0;
            color: #6b7280;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #374151;
        }

        .input-group .form-control.password-input {
            border-radius: 0;
            border-right: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="bi bi-box-seam"></i>
                </div>
                <h1>GeneXus Registry</h1>
                <p>Inicia sesión para continuar</p>
            </div>

            <!-- Mensaje de error -->
            <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                <i class="bi bi-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>

            <!-- Formulario de login -->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Ingresa tu usuario"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input
                            type="password"
                            class="form-control password-input"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >
                        <span class="password-toggle" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')">
                            <i class="bi bi-eye" id="passwordToggleIcon"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-login" id="loginButton">
                    <span id="buttonText">Iniciar Sesión</span>
                    <span id="buttonSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </span>
                </button>
            </form>
        </div>

        <div class="footer-text">
            <small>Sistema de Gestión de Objetos GeneXus</small>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const loginButton = document.getElementById('loginButton');
        const buttonText = document.getElementById('buttonText');
        const buttonSpinner = document.getElementById('buttonSpinner');

        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Obtener valores del formulario
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // Validar
            if (!username || !password) {
                showError('Por favor completa todos los campos');
                return;
            }

            // Deshabilitar botón y mostrar spinner
            loginButton.disabled = true;
            buttonText.classList.add('d-none');
            buttonSpinner.classList.remove('d-none');
            errorAlert.classList.add('d-none');

            try {
                // Hacer login
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include', // Importante para recibir cookies
                });

                const data = await response.json();

                if (response.ok) {
                    // Login exitoso - verificar si debe cambiar contraseña
                    if (data.user && data.user.must_change_password) {
                        // Redirigir a cambio de contraseña obligatorio
                        window.location.href = '/web/change-password';
                    } else {
                        // Redirigir al inicio
                        window.location.href = '/web';
                    }
                } else {
                    // Mostrar error
                    showError(data.detail || 'Credenciales incorrectas');
                }
            } catch (error) {
                console.error('Error durante login:', error);
                showError('Error de conexión. Por favor intenta nuevamente.');
            } finally {
                // Re-habilitar botón
                loginButton.disabled = false;
                buttonText.classList.remove('d-none');
                buttonSpinner.classList.add('d-none');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorAlert.classList.remove('d-none');
        }
    </script>
</body>
</html>
