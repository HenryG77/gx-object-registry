<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - GeneXus Object Registry</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .change-password-container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
        }

        .change-password-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }

        .change-password-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .change-password-header .logo {
            font-size: 3rem;
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .change-password-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .change-password-header p {
            color: #6b7280;
            margin: 0;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #d1d5db;
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .btn-change-password {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-change-password:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-change-password:active {
            transform: translateY(0);
        }

        .alert {
            border-radius: 10px;
            border: none;
        }

        .warning-box {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .warning-box .icon {
            color: #f59e0b;
            font-size: 1.2rem;
            margin-right: 10px;
        }

        .warning-box p {
            margin: 0;
            color: #92400e;
            font-size: 0.9rem;
        }

        .user-info {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .user-info strong {
            color: #1f2937;
        }

        .input-group-text {
            border-radius: 10px 0 0 10px;
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0;
        }

        .password-requirements {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 5px;
        }

        .password-toggle {
            cursor: pointer;
            padding: 12px 16px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-left: none;
            border-radius: 0 10px 10px 0;
            color: #6b7280;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #374151;
        }

        .input-group .form-control.password-input {
            border-radius: 0;
            border-right: none;
        }
    </style>
</head>
<body>
    <div class="change-password-container">
        <div class="change-password-card">
            <div class="change-password-header">
                <div class="logo">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h1>Cambio de Contraseña Requerido</h1>
                <p>Debes cambiar tu contraseña para continuar</p>
            </div>

            <!-- Warning box -->
            <div class="warning-box">
                <div class="d-flex align-items-start">
                    <i class="bi bi-exclamation-triangle-fill icon"></i>
                    <div>
                        <p><strong>Contraseña Temporal Detectada</strong></p>
                        <p>Tu contraseña actual es temporal. Por favor, establece una nueva contraseña segura para acceder al sistema.</p>
                    </div>
                </div>
            </div>

            <!-- User info -->
            <div class="user-info">
                <span>Usuario: <strong id="username"></strong></span>
            </div>

            <!-- Mensaje de error -->
            <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                <i class="bi bi-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>

            <!-- Formulario de cambio de contraseña -->
            <form id="changePasswordForm">
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Nueva Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input
                            type="password"
                            class="form-control password-input"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Ingresa tu nueva contraseña"
                            required
                            minlength="6"
                            maxlength="100"
                            autofocus
                        >
                        <span class="password-toggle" onclick="togglePasswordVisibility('newPassword', 'newPasswordToggleIcon')">
                            <i class="bi bi-eye" id="newPasswordToggleIcon"></i>
                        </span>
                    </div>
                    <div class="password-requirements">
                        <i class="bi bi-info-circle"></i> Mínimo 6 caracteres. No puede ser igual a tu nombre de usuario.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input
                            type="password"
                            class="form-control password-input"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirma tu nueva contraseña"
                            required
                            minlength="6"
                            maxlength="100"
                        >
                        <span class="password-toggle" onclick="togglePasswordVisibility('confirmPassword', 'confirmPasswordToggleIcon')">
                            <i class="bi bi-eye" id="confirmPasswordToggleIcon"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-change-password" id="changePasswordButton">
                    <span id="buttonText">Cambiar Contraseña</span>
                    <span id="buttonSpinner" class="spinner-border spinner-border-sm d-none" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const changePasswordForm = document.getElementById('changePasswordForm');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const changePasswordButton = document.getElementById('changePasswordButton');
        const buttonText = document.getElementById('buttonText');
        const buttonSpinner = document.getElementById('buttonSpinner');
        const usernameElement = document.getElementById('username');

        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }

        // Cargar información del usuario actual
        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/auth/me', {
                    credentials: 'include'
                });

                if (response.ok) {
                    const user = await response.json();
                    usernameElement.textContent = user.username;

                    // Si el usuario NO necesita cambiar la contraseña, redirigir al inicio
                    if (!user.must_change_password) {
                        window.location.href = '/web';
                    }
                } else {
                    // Si no está autenticado, redirigir al login
                    window.location.href = '/web/login';
                }
            } catch (error) {
                console.error('Error al cargar usuario:', error);
                window.location.href = '/web/login';
            }
        }

        // Cargar usuario al cargar la página
        loadCurrentUser();

        // Prevenir que el usuario salga de la página con Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                e.preventDefault();
                showError('Debes cambiar tu contraseña para continuar');
            }
        });

        changePasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Obtener valores del formulario
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const username = usernameElement.textContent;

            // Validar
            if (!newPassword || !confirmPassword) {
                showError('Por favor completa todos los campos');
                return;
            }

            if (newPassword.length < 6) {
                showError('La nueva contraseña debe tener al menos 6 caracteres');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('Las contraseñas no coinciden');
                return;
            }

            if (newPassword === username) {
                showError('La nueva contraseña no puede ser igual a tu nombre de usuario');
                return;
            }

            // Deshabilitar botón y mostrar spinner
            changePasswordButton.disabled = true;
            buttonText.classList.add('d-none');
            buttonSpinner.classList.remove('d-none');
            errorAlert.classList.add('d-none');

            try {
                // Cambiar contraseña
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        new_password: newPassword,
                        current_password: null  // No necesitamos la contraseña actual para cambio forzado
                    }),
                    credentials: 'include',
                });

                const data = await response.json();

                if (response.ok) {
                    // Cambio exitoso - redirigir al inicio
                    window.location.href = '/web';
                } else {
                    // Mostrar error
                    showError(data.detail || 'Error al cambiar la contraseña');
                }
            } catch (error) {
                console.error('Error durante cambio de contraseña:', error);
                showError('Error de conexión. Por favor intenta nuevamente.');
            } finally {
                // Re-habilitar botón
                changePasswordButton.disabled = false;
                buttonText.classList.remove('d-none');
                buttonSpinner.classList.add('d-none');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorAlert.classList.remove('d-none');
        }
    </script>
</body>
</html>
